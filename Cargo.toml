[package]
name = "fusor-spotify-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Spotify client for the terminal, written in HTML with Hypercmd"
readme = "README.md"
repository = "https://github.com/fusor-rs/spotify-tui"
keywords = ["spotify", "terminal", "music", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "ui/**", "assets/**", "build.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[[bin]]
name = "spt"
path = "src/main.rs"

[package.metadata.hypercmd]
entry = "ui/app.html"
templates = ["ui"]
styles = ["ui/terminal.css"]

[dependencies]
base64 = "=0.22.1"
fusor-components = { version = "=0.1.5", default-features = false }
keyring = { version = "=3.6.3", features = [
    "apple-native", "sync-secret-service", "crypto-rust", "vendored",
] }
librespot-connect = "=0.8.0"
librespot-core = "=0.8.0"
librespot-playback = { version = "=0.8.0", features = ["rodio-backend"] }
rand = "=0.9.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
http = "=1.5.0"
librespot-protocol = "=0.8.0"
protobuf = "=3.7.2"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
thiserror = "=2.0.21"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }

[dependencies.fusor]
package = "fusor-core"
version = "=0.1.5"
default-features = false
features = ["derive"]

[dependencies.hypercmd]
version = "=0.1.2"

[build-dependencies.hypercmd-build]
version = "=0.1.2"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
